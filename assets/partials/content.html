<main id="screen-content" class="screen stage player-stage">

  <header class="player-topbar">
    <button type="button" class="back-button" id="contentBackButton">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6l6 6" />
      </svg>
      <span>메뉴로 돌아가기</span>
    </button>

    <div class="player-title">
      <h1 class="player-category" id="categoryLabel"></h1>
      <span class="player-place" id="placeSub"></span>
    </div>

    <div class="status-badge status-badge--inline">
      <span class="status-dot"></span>
      <span class="status-label">수어 안내 중</span>
    </div>
  </header>

  <div class="player-video-wrap">
    <div class="player-video-card">
      <video id="contentVideoA" class="player-video is-active" muted playsinline
             disablepictureinpicture disableremoteplayback preload="auto"></video>
      <video id="contentVideoB" class="player-video" muted playsinline
             disablepictureinpicture disableremoteplayback preload="auto"></video>

      <div id="contentFallback" class="video-fallback" hidden>
        <p class="fallback-logo">수어와</p>
        <p class="fallback-text">준비된 안내 영상이 없습니다</p>
      </div>

      <!-- 로딩이 0.3초 넘게 걸릴 때만 부드럽게 나타나는 표시 -->
      <div id="contentLoading" class="player-loading" hidden aria-hidden="true">
        <span class="player-loading-dot"></span>
      </div>
    </div>
  </div>

  <div class="player-progress">
    <span class="player-progress-count" id="progressCount">1 / 1</span>
    <div class="player-progress-track">
      <div class="player-progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="player-actions">
    <button type="button" class="nav-button" id="prevButton">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6l6 6" />
      </svg>
      <span>이전</span>
    </button>

    <button type="button" class="nav-button nav-button--replay" id="replayButton">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
        <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
      </svg>
      <span>처음부터 다시 보기</span>
    </button>

    <button type="button" class="nav-button nav-button--primary" id="nextButton">
      <span>다음</span>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6l-6 6" />
      </svg>
    </button>
  </div>

</main>
