
<main id="screen-relay" class="screen stage relay-stage">

  <div class="relay-header">
    <svg class="relay-icon" viewBox="0 0 24 24" fill="none" stroke="#3D8BFF" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4" />
      <path d="M3 8a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -8" />
    </svg>
    <h1 class="relay-title">107 수어통역 연결</h1>
    <p class="relay-desc">화면에 없는 내용은 수어통역사와 영상통화로 문의하세요</p>
  </div>

  <div class="relay-qr-panel">
    <div id="qrCode" class="relay-qr"></div>
    <img id="qrFallback" class="relay-qr" src="assets/qr_107.png" alt="107 수어통역 연결 QR 코드" hidden>
  </div>

  <div class="relay-instructions">
    <p class="relay-instruction-main" id="relayInstructionMain"></p>
    <p class="relay-instruction-sub" id="relayInstructionSub"></p>
  </div>

  <button type="button" class="relay-back-button" id="relayBackButton">
    <svg class="relay-back-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12l14 0" />
      <path d="M5 12l6 6" />
      <path d="M5 12l6 -6" />
    </svg>
    <span id="relayBackLabel"></span>
  </button>

</main>
