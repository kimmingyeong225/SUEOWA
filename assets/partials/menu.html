<main id="screen-menu" class="screen stage">

  <section class="avatar-pane" aria-hidden="true">
    <video id="avatarVideo" class="menu-video" muted loop playsinline
           disablepictureinpicture disableremoteplayback preload="auto"></video>

    <div id="avatarFallback" class="video-fallback" hidden>
      <p class="fallback-logo">수어와</p>
      <p class="fallback-text">아바타 수어 안내 영상을 준비 중입니다</p>
    </div>

    <div class="menu-video-vignette"></div>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span class="status-label menu-status-label">수어 안내 중</span>
    </div>

    <div class="menu-prompt-bar">
      <p class="menu-prompt" id="menuPrompt"></p>
    </div>
  </section>

  <section class="content-pane">
    <header class="place-header">
      <h1 class="place-name" id="placeName">태종대</h1>
      <span class="place-sub">수어 안내</span>
    </header>

    <div class="category-grid" id="categoryGrid"></div>

    <button type="button" class="interpreter-cta" id="menuInterpreterCta">
      <svg class="interpreter-cta-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="7" y="17" width="34" height="30" rx="6" stroke="#ffffff" stroke-width="4"/>
        <path d="M41 27 L56 19 V45 L41 37 Z" fill="#ffffff"/>
      </svg>
      <span class="interpreter-cta-text">다른 질문이 있어요 · 수어통역 연결 107</span>
    </button>
  </section>

</main>
