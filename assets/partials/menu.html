<main id="screen-menu" class="screen stage">

  <section class="avatar-pane" aria-hidden="true">
    <video id="avatarVideo" class="menu-video" muted loop playsinline
           disablepictureinpicture disableremoteplayback preload="auto"></video>

    <div id="avatarFallback" class="video-fallback" hidden>
      <p class="fallback-logo">수어와</p>
      <p class="fallback-text">아바타 수어 안내 영상을 준비 중입니다</p>
    </div>

    <div class="menu-video-vignette"></div>
<!-- 
    <div class="status-badge">
      <span class="status-dot"></span>
      <span class="status-label menu-status-label">수어 안내 중</span>
    </div> -->

    <div class="menu-prompt-bar">
      <p class="menu-prompt" id="menuPrompt"></p>
    </div>
  </section>

  <section class="content-pane">
    <header class="place-header">
      <button type="button" class="back-button" id="menuBackButton">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6l6 6" />
        </svg>
        <span id="menuBackLabel"></span>
      </button>

      <div class="place-title-group">
        <h1 class="place-name" id="placeName"></h1>
        <span class="place-sub" id="placeSubLabel"></span>
      </div>
    </header>

    <div class="category-grid" id="categoryGrid"></div>

    <div class="interpreter-cta-row">
      <button type="button" class="interpreter-cta" id="menuInterpreterCta">
        <svg class="interpreter-cta-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="7" y="17" width="34" height="30" rx="6" stroke="#ffffff" stroke-width="4"/>
          <path d="M41 27 L56 19 V45 L41 37 Z" fill="#ffffff"/>
        </svg>
        <span class="interpreter-cta-text" id="menuInterpreterCtaText"></span>
      </button>

      <button type="button" class="survey-menu-button" id="surveyMenuButton">
        <svg class="survey-menu-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245" />
        </svg>
        <span>평가</span>
      </button>
    </div>
  </section>

  <!-- 관리자 화면 진입용 숨김 탭 영역: 5회 연속 탭하면 열림 (아이콘/표시 없음) -->
  <div class="admin-tap-zone" id="adminTapZone" aria-hidden="true"></div>

</main>
