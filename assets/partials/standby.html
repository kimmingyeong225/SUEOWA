<main id="screen-standby" class="screen stage is-active">

  <section class="video-pane" aria-hidden="true">
    <div class="intro-video-card">
      <video id="introVideoA" class="intro-video is-active" muted playsinline
             disablepictureinpicture disableremoteplayback preload="auto"></video>
      <video id="introVideoB" class="intro-video" muted playsinline
             disablepictureinpicture disableremoteplayback preload="auto"></video>

      <!-- 영상이 하나도 없을 때 보여줄 정적 대체 화면 -->
      <div id="videoFallback" class="video-fallback" hidden>
        <p class="fallback-logo">수어와</p>
        <p class="fallback-text">아바타 수어 안내 영상을 준비 중입니다</p>
      </div>

      <div class="intro-video-vignette"></div>

      <div class="intro-caption-bar">
        <p class="intro-caption" id="introCaption"></p>
      </div>
    </div>
  </section>

  <section class="cta-pane" aria-hidden="true">
    <div class="cta-center">
      <div class="cta-button-wrap">
        <div class="cta-glow"></div>
        <div class="cta-button">
          <svg class="cta-icon" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <rect x="41" y="14" width="18" height="40" rx="9" fill="#ffffff"/>
            <ellipse cx="50" cy="66" rx="16" ry="5" fill="#ffffff" opacity="0.25"/>
          </svg>
        </div>
      </div>

      <div class="cta-text-group">
        <p class="cta-text" id="ctaText"></p>
        <p class="cta-subtext" id="ctaSubtext"></p>
      </div>
    </div>

  </section>

  <!-- 앱 전역 언어 토글. 여기서 고르면 모든 화면의 UI 문구와 콘텐츠
       재생 화면의 자막 언어가 함께 바뀐다 -->
  <div class="lang-toggle standby-lang-toggle" id="standbyLangToggle" role="group" aria-label="Language">
    <button type="button" class="lang-toggle-button is-active" id="standbyLangKoButton" data-lang="ko">한국어</button>
    <button type="button" class="lang-toggle-button" id="standbyLangEnButton" data-lang="en">English</button>
  </div>

</main>
