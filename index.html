<!-- 네 화면(대기/메뉴/콘텐츠/107)은 assets/partials/*.html로 각각 분리돼 있고,
     아래 로더 스크립트가 fetch로 불러와 여기에 그대로 붙여넣는다.
     페이지 이동은 여전히 없다 — 화면 전환은 .screen.is-active 토글로만 이뤄진다 -->
<div id="app"></div>

<!-- 화면 전체 터치 감지 레이어. 네 화면이 공유하며, 대기 화면일 때만
     터치=메뉴 이동으로 동작(js에서 tap-layer--passive 토글) -->
<div id="tapLayer" class="tap-layer"></div>
